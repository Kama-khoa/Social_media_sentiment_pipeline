crawl:
  max_comments_per_video: 500
  historical_scan_channels_per_day: 5
  historical_scan_max_results: 10000
  daily_scan_lookback_days: 3
  daily_scan_max_results: 20
  enrich_max_workers: 8
  video_batch_size: 50
  new_video_min_age_days: 3
  growing_video_max_age_days: 14
  mature_video_max_age_days: 30
  growing_recrawl_interval_days: 3
  mature_recrawl_interval_days: 7
  archived_recrawl_interval_days: 30

comment_downloader:
  request_delay_seconds: 1.0
  max_retries: 3

quota:
  daily_budget: 10000
  safety_buffer: 500
  bucket_search: 9000
  bucket_channel_seed: 500

nlp:
  confidence_threshold: 0.80
  aspect_labels:
    - Pin
    - Camera
    - "Màn hình"
    - "Hiệu năng"
    - "Thiết kế"
    - "Giá"
  sentiment_labels:
    - positive
    - negative
    - neutral
  gemini_batch_size: 50

api:
  redis_ttl_seconds: 300
  host: "0.0.0.0"
  port: 8000
