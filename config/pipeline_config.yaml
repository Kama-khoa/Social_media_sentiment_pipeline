crawl:
  max_comments_per_video: 500
  historical_scan_channels_per_day: 20
  historical_scan_max_results: 10000
  historical_scan_lookback_days: 180
  daily_scan_lookback_days: 3
  daily_scan_max_results: 20
  enrich_max_workers: 1
  video_batch_size: 30
  new_video_min_age_days: 3
  growing_video_max_age_days: 14
  mature_video_max_age_days: 30
  growing_recrawl_interval_days: 3
  mature_recrawl_interval_days: 7
  archived_recrawl_interval_days: 30
  ytdlp_cookies_path: config/youtube_cookies.txt
  ytdlp_cookies_paths:
    - config/youtube_cookies.txt
    - config/youtube_cookies_2.txt
    - config/youtube_cookies_3.txt
  ytdlp_session_cooldown_seconds: 3600

comment_downloader:
  request_delay_seconds: 1.0
  max_retries: 3

api_comment_backfill:
  max_videos_per_run: 1000
  max_comments_per_video: 100
  max_pages_per_video: 1
  daily_quota_units: 5000
  request_delay_seconds: 0.2

quota:
  daily_budget: 10000
  safety_buffer: 500
  bucket_search: 9000
  bucket_channel_seed: 500

nlp:
  confidence_threshold: 0.70
  aspect_labels:
    - Pin
    - Camera
    - "Màn hình"
    - "Hiệu năng"
    - "Thiết kế"
    - "Giá"
  sentiment_labels:
    - positive
    - negative
    - neutral
  gemini_batch_size: 50
  bq_write_batch_size: 50
  bq_write_max_retries: 2
  bq_write_retry_base_seconds: 2
  product_resolver_auto_approve_threshold: 0.85
  product_resolver_auto_alias_threshold: 0.90
  product_resolver_recheck_batch_size: 50

api:
  redis_ttl_seconds: 300
  host: "0.0.0.0"
  port: 8000
