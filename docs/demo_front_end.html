<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Sentiment - Updated Sandbox Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            background: '#f1f5f9', // Nền xám nhạt hơn cho giống dashboard admin
            surface: '#ffffff',
            border: '#e2e8f0',
          },
          animation: {
            'marquee': 'marquee 25s linear infinite',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(-100%)' },
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- SHARED COMPONENTS ---
    const Card = ({ children, className = '' }) => (
      <div className={`bg-surface border border-border rounded-lg shadow-sm ${className}`}>{children}</div>
    );

    const Badge = ({ children, variant = 'default' }) => {
      const variants = {
        default: 'bg-slate-100 text-slate-700',
        success: 'bg-emerald-100 text-emerald-700',
        danger: 'bg-rose-100 text-rose-700',
        warning: 'bg-amber-100 text-amber-700',
        brand: 'bg-indigo-100 text-indigo-700'
      };
      return <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]}`}>{children}</span>;
    };

    // --- PAGES ---

    // 1. Guest: Search/Overview Page
    const SearchPage = () => (
      <div className="flex flex-col h-full relative pb-16">
        <div className="max-w-6xl mx-auto px-4 py-8 flex-1 w-full animate-[fadeIn_0.3s_ease-out]">
          <div className="text-center mb-10">
            <h1 className="text-3xl font-semibold tracking-tight mb-4">Khám phá đánh giá công nghệ</h1>
            <div className="max-w-2xl mx-auto flex items-center bg-white border border-slate-300 rounded-full px-4 py-2 shadow-sm focus-within:ring-2 focus-within:ring-indigo-500 transition-all">
              <svg className="w-5 h-5 text-slate-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <input type="text" placeholder="Tìm kiếm sản phẩm (vd: iPhone 15 Pro, RTX 4090)..." className="w-full bg-transparent border-none focus:outline-none text-slate-700" />
              <button className="bg-slate-900 text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-slate-800 transition">Tìm kiếm</button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {[
              { name: "iPhone 15 Pro Max", brand: "Apple", pos: "75%", neg: "10%" },
              { name: "Samsung S24 Ultra", brand: "Samsung", pos: "82%", neg: "8%" },
              { name: "MacBook Pro M3", brand: "Apple", pos: "88%", neg: "5%" }
            ].map((item, i) => (
              <Card key={i} className="p-5 hover:-translate-y-1 hover:shadow-md transition-all cursor-pointer">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <h3 className="font-semibold text-lg">{item.name}</h3>
                    <p className="text-sm text-slate-500">{item.brand}</p>
                  </div>
                  <Badge variant="success">Hot</Badge>
                </div>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between"><span className="text-slate-500">Tích cực:</span><span className="text-emerald-600 font-medium">{item.pos}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">Tiêu cực:</span><span className="text-rose-600 font-medium">{item.neg}</span></div>
                </div>
              </Card>
            ))}
          </div>
        </div>

        {/* Ticker chạy tự động bên dưới */}
        <div className="fixed bottom-0 left-0 right-0 bg-slate-900 text-white py-2 overflow-hidden flex items-center border-t-4 border-indigo-500 z-40">
          <div className="flex whitespace-nowrap animate-marquee">
            <span className="mx-8 font-medium">🔥 Xu hướng:</span>
            <span className="mx-8">📱 <span className="font-semibold">S24 Ultra</span>: Tích cực (82%) | Camera được khen nhiều nhất</span>
            <span className="mx-8 text-slate-400">•</span>
            <span className="mx-8">💻 <span className="font-semibold">MacBook Pro M3</span>: Tích cực (88%) | Pin vượt kỳ vọng</span>
            <span className="mx-8 text-slate-400">•</span>
            <span className="mx-8">🎧 <span className="font-semibold">AirPods Pro 2</span>: Tích cực (79%) | Chống ồn cải thiện rõ rệt</span>
            <span className="mx-8 text-slate-400">•</span>
            <span className="mx-8">🎮 <span className="font-semibold">PS5 Slim</span>: Tích cực (70%) | Thiết kế nhỏ gọn nhưng giá cao</span>
          </div>
        </div>
      </div>
    );

    // 2. Guest: Product Detail Page (Thêm Specs)
    const ProductDetailPage = () => (
      <div className="max-w-6xl mx-auto px-4 py-8 animate-[fadeIn_0.3s_ease-out] pb-24">
        <div className="mb-6 flex items-center justify-between">
          <div>
            <div className="flex items-center gap-3 mb-2">
              <h2 className="text-3xl font-semibold">Samsung Galaxy S24 Ultra</h2>
              <Badge variant="brand">Smartphone</Badge>
            </div>
            <p className="text-slate-500">Phân tích từ 45,230 bình luận YouTube trong 30 ngày qua.</p>
          </div>
        </div>

        {/* PHẦN MỚI: Thông số kỹ thuật nhà phát hành */}
        <Card className="p-5 mb-6 bg-slate-50 border-indigo-100">
          <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
            <h3 className="font-semibold text-lg text-slate-800">Thông tin & Thông số kỹ thuật (Official)</h3>
            <span className="text-xs text-slate-500">Cập nhật: Jan 2024</span>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 text-sm">
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Màn hình</span><span className="font-medium">6.8" Dynamic AMOLED 2X, 120Hz</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Vi xử lý (CPU)</span><span className="font-medium">Snapdragon 8 Gen 3 for Galaxy</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Camera chính</span><span className="font-medium">200MP + 50MP + 12MP + 10MP</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Pin & Sạc</span><span className="font-medium">5000 mAh, Sạc siêu nhanh 45W</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Hệ điều hành</span><span className="font-medium">Android 14, One UI 6.1</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Chất liệu</span><span className="font-medium">Khung Titanium, Kính Gorilla Armor</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Tính năng đặc biệt</span><span className="font-medium">Galaxy AI, Bút S-Pen tích hợp</span></div>
            <div><span className="text-slate-500 block text-xs uppercase mb-1">Giá công bố (VNĐ)</span><span className="font-medium text-indigo-700">33.990.000 VNĐ</span></div>
          </div>
        </Card>

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
          <Card className="p-5 lg:col-span-1 flex flex-col items-center justify-center min-h-[300px] border-dashed border-2">
            <span className="text-slate-400">[Radar Chart - Sentiment Khía cạnh]</span>
          </Card>
          <Card className="p-5 lg:col-span-2 flex flex-col items-center justify-center min-h-[300px] border-dashed border-2">
             <span className="text-slate-400">[Area Chart - Timeline Sentiment]</span>
          </Card>
        </div>
      </div>
    );

    // 3. Admin: Overview Dashboard (Dựa theo image_fcad48.png)
    const AdminOverviewPage = () => (
      <div className="p-6 animate-[fadeIn_0.3s_ease-out] w-full">
        {/* Header giống ảnh */}
        <div className="flex justify-between items-center mb-4 border-b border-slate-200 pb-4">
          <h2 className="text-xl font-bold text-slate-800">System Sentiment Traffic Dashboard</h2>
          <div className="flex items-center gap-4">
            <span className="text-sm text-slate-500">Data refreshed at {new Date().toLocaleString()}</span>
            <button className="p-1 border border-slate-300 rounded hover:bg-slate-50">
              <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button className="p-1 border border-slate-300 rounded hover:bg-slate-50">...</button>
          </div>
        </div>

        {/* Lưới Layout 3 dòng dựa theo ảnh tham khảo */}
        <div className="grid grid-cols-12 gap-4">
          
          {/* Row 1: Left (Date + KPI Times), Middle (Smileys), Right (Text KPIs) */}
          <div className="col-span-2 space-y-4">
            <Card className="p-3">
              <p className="text-xs font-semibold mb-1">Created Date</p>
              <input type="date" className="w-full text-xs border border-slate-200 p-1 rounded" />
            </Card>
            <Card className="p-4 text-center">
              <p className="text-xs font-semibold mb-2">Average Pipeline Time</p>
              <div className="mb-3">
                <p className="text-xs text-slate-500">Avg. Scrape</p>
                <p className="font-bold">12 Mins</p>
              </div>
              <div className="mb-3">
                <p className="text-xs text-slate-500">NLP Process</p>
                <p className="font-bold">4.5 Mins</p>
              </div>
              <div>
                <p className="text-xs text-slate-500">DB Sync</p>
                <p className="font-bold">1.2 Mins</p>
              </div>
            </Card>
          </div>

          <div className="col-span-7">
            <Card className="p-4 flex justify-between items-center mb-4">
              <div className="text-center">
                <p className="font-bold text-xl">Sentiment Score</p>
                <p className="text-2xl font-bold mt-1">68.5%</p>
              </div>
              <div className="flex gap-8 items-center">
                <div className="text-center">
                  <p className="text-xs font-semibold mb-1">Positives</p>
                  <p className="font-bold text-lg">124,500</p>
                  <div className="w-12 h-12 rounded-full border-4 border-emerald-400 text-emerald-500 flex items-center justify-center mx-auto mt-2 text-2xl">😊</div>
                </div>
                <div className="text-center">
                  <p className="text-xs font-semibold mb-1">Negatives</p>
                  <p className="font-bold text-lg">80,210</p>
                  <div className="w-12 h-12 rounded-full border-4 border-rose-400 text-rose-500 flex items-center justify-center mx-auto mt-2 text-2xl">🙁</div>
                </div>
                <div className="text-center">
                  <p className="text-xs font-semibold mb-1">Neutrals</p>
                  <p className="font-bold text-lg">94,300</p>
                  <div className="w-12 h-12 rounded-full border-4 border-amber-400 text-amber-500 flex items-center justify-center mx-auto mt-2 text-2xl">😐</div>
                </div>
              </div>
            </Card>

            <Card className="p-4 h-[250px]">
              <p className="text-xs font-bold mb-4">Comments Sentiments by Aspect (Grouped Bar Chart)</p>
              {/* Giả lập Bar Chart */}
              <div className="flex items-end justify-around h-[160px] pb-2 border-b border-slate-200">
                {[
                  { label: "Camera", p: 80, n: 20 },
                  { label: "Pin", p: 60, n: 50 },
                  { label: "Giá", p: 30, n: 90 },
                  { label: "Màn hình", p: 75, n: 10 }
                ].map((col, i) => (
                  <div key={i} className="flex gap-1 items-end h-full">
                    <div style={{height: `${col.p}%`}} className="w-8 bg-emerald-400 rounded-t relative"><span className="absolute -top-4 text-[10px] w-full text-center">{col.p}k</span></div>
                    <div style={{height: `${col.n}%`}} className="w-8 bg-rose-400 rounded-t relative"><span className="absolute -top-4 text-[10px] w-full text-center">{col.n}k</span></div>
                    <span className="absolute bottom-6 translate-y-full text-[10px] w-16 text-center -ml-2">{col.label}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>

          <div className="col-span-3">
             <Card className="p-4 h-full">
                <p className="text-xs font-bold mb-4">Current Data Statuses</p>
                <div className="grid grid-cols-2 gap-y-6 text-center mt-6">
                  <div><p className="text-xs text-slate-500">New Comments</p><p className="font-bold text-lg">2,995</p></div>
                  <div><p className="text-xs text-slate-500">Processed</p><p className="font-bold text-lg">1,670</p></div>
                  <div><p className="text-xs text-slate-500">In Queue</p><p className="font-bold text-lg">290</p></div>
                  <div><p className="text-xs text-slate-500">Failed NLP</p><p className="font-bold text-lg">50</p></div>
                  <div><p className="text-xs text-slate-500">Total Products</p><p className="font-bold text-lg">97</p></div>
                  <div><p className="text-xs text-slate-500">Total Channels</p><p className="font-bold text-lg">206</p></div>
                </div>
             </Card>
          </div>

          {/* Row 2: Bottom Charts */}
          <div className="col-span-4">
            <Card className="p-4 h-[250px]">
              <p className="text-xs font-bold mb-2">Volume by Day of Week</p>
              <div className="h-[180px] bg-slate-50 rounded border-dashed border-2 flex items-center justify-center text-slate-400 text-xs">
                [Area Chart - Giống ảnh mẫu]
              </div>
            </Card>
          </div>
          <div className="col-span-4">
             <Card className="p-4 h-[250px]">
              <p className="text-xs font-bold mb-2">Comments by Category</p>
              <div className="h-[180px] flex flex-col justify-end gap-1">
                 <div className="bg-purple-500 w-full text-center text-white text-xs py-1">Smartphone (30%)</div>
                 <div className="bg-amber-400 w-full text-center text-white text-xs py-1">Laptop (25%)</div>
                 <div className="bg-rose-400 w-full text-center text-white text-xs py-1">Tablet (20%)</div>
                 <div className="bg-cyan-400 w-full text-center text-white text-xs py-1">Headphone (15%)</div>
                 <div className="bg-blue-500 w-full text-center text-white text-xs py-1">PC Parts (10%)</div>
              </div>
            </Card>
          </div>
          <div className="col-span-4">
             <Card className="p-4 h-[250px]">
              <p className="text-xs font-bold mb-2">Top Keywords Matched</p>
              <div className="space-y-3 mt-4">
                {[
                  { name: 'Pin trâu', val: 93 }, { name: 'Màn hình đẹp', val: 74 }, { name: 'Sạc chậm', val: 35 }
                ].map((kw, i) => (
                  <div key={i} className="flex items-center text-xs">
                    <span className="w-20 truncate">{kw.name}</span>
                    <div className="flex-1 bg-slate-100 h-4 ml-2 relative">
                      <div className="bg-indigo-700 h-full" style={{width: `${kw.val}%`}}></div>
                    </div>
                    <span className="ml-2">{kw.val}k</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>
      </div>
    );

    const AdminPlaceholderPage = ({ title }) => (
      <div className="p-8"><h2 className="text-2xl font-semibold mb-6">{title}</h2><Card className="p-10 text-center text-slate-500 border-dashed border-2">Khu vực quản lý: {title}</Card></div>
    );

    // --- MAIN APP (Sandbox Navigation) ---
    const App = () => {
      const [currentView, setCurrentView] = useState('search');
      const [adminTab, setAdminTab] = useState('overview');

      const userNav = [
        { id: 'search', label: 'Guest Overview' },
        { id: 'detail', label: 'Product Detail' },
      ];

      // Đã cập nhật 6 tabs theo yêu cầu
      const adminNav = [
        { id: 'overview', label: 'Dashboard Overview' },
        { id: 'keywords', label: 'Quản lý từ khóa' },
        { id: 'channels', label: 'Quản lý kênh' },
        { id: 'products', label: 'Quản lý sản phẩm' },
        { id: 'logs', label: 'Quản lý log pipeline' },
        { id: 'airflow', label: 'Quản lý Airflow' },
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navbar */}
          <header className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-border shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">TS</div>
                <span className="font-semibold text-slate-900 hidden sm:block">Tech Sentiment</span>
              </div>
              
              <nav className="flex gap-1 bg-slate-100 p-1 rounded-lg">
                {userNav.map(nav => (
                  <button key={nav.id} onClick={() => setCurrentView(nav.id)} className={`px-4 py-1.5 text-sm font-medium rounded-md transition-all ${currentView === nav.id ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}>{nav.label}</button>
                ))}
                <button onClick={() => setCurrentView('admin')} className={`px-4 py-1.5 text-sm font-medium rounded-md transition-all flex items-center gap-1 ${currentView === 'admin' ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-indigo-600'}`}>Admin</button>
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 flex overflow-hidden">
            {currentView === 'admin' ? (
              <div className="flex w-full">
                {/* Updated Admin Sidebar - 6 Tabs */}
                <aside className="w-64 bg-white border-r border-border flex flex-col min-h-[calc(100vh-4rem)]">
                  <div className="p-4 border-b border-slate-100">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold">A</div>
                      <div><p className="font-semibold text-sm">System Admin</p><p className="text-xs text-emerald-600">● Online</p></div>
                    </div>
                  </div>
                  <nav className="p-2 space-y-1 flex-1">
                    {adminNav.map(tab => (
                       <button 
                        key={tab.id} 
                        onClick={() => setAdminTab(tab.id)} 
                        className={`w-full text-left px-3 py-2 text-sm font-medium rounded-md transition-colors ${adminTab === tab.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-50'}`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </nav>
                </aside>
                <div className="flex-1 overflow-y-auto pb-10">
                  {adminTab === 'overview' && <AdminOverviewPage />}
                  {adminTab !== 'overview' && <AdminPlaceholderPage title={adminNav.find(t => t.id === adminTab).label} />}
                </div>
              </div>
            ) : (
              <div className="w-full overflow-y-auto">
                {currentView === 'search' && <SearchPage />}
                {currentView === 'detail' && <ProductDetailPage />}
              </div>
            )}
          </main>
          
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
          `}</style>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
