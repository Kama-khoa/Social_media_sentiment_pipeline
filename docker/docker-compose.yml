name: social_media_sentiment_pipeline

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlB7JAIBkR1I-_0c-L1gEw=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/airflow/dags
    - PYTHONPATH=/opt/airflow
    - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp_credentials.json
    - YOUTUBE_COOKIES_DIR=/opt/airflow/config
    - AIRFLOW__CORE__PARALLELISM=4
  env_file:
    - ../.env
  volumes:
    # Mount the entire project into /opt/airflow so dags, elt, transform, and configs are available
    - ..:/opt/airflow
    # Mount the GCP credentials file defined in .env into the container
    - ${GOOGLE_APPLICATION_CREDENTIALS:?Set GOOGLE_APPLICATION_CREDENTIALS in .env or shell}:/opt/airflow/gcp_credentials.json:ro
    # Cookie files are ignored by git and are exposed read-only for yt-dlp video extraction only.
    - ../config:/opt/airflow/config:ro
  user: "${AIRFLOW_UID:-50000}:0"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  web-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=webapi
      - POSTGRES_PASSWORD=webapi
      - POSTGRES_DB=sentiment_webapi
    ports:
      - "5433:5432"
    volumes:
      - web-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "webapi", "-d", "sentiment_webapi"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  web-db-volume:
  postgres-db-volume:
